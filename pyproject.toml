[project]
name = "erpgulf_themes"
authors = [
    { name = "ERPGulf", email = "support@erpgulf.com" }
]
description = "Desk themes for Frappe v16.5+: Claudion Day, Claudion Night and ERPGulf"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.5.0,<17.0.0"
